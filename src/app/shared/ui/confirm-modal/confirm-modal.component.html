@if (isOpen()) {
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-xs transition-opacity animate-in fade-in duration-200"
  (click)="onBackdropClick($event)"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="title()">
  
  <div class="relative w-full max-w-md bg-surface-container-lowest rounded-2xl border border-outline-variant/60 shadow-2xl p-6 overflow-hidden z-10 animate-in zoom-in-95 duration-200"
    (click)="$event.stopPropagation()">
    
    <!-- Header with Icon & Title -->
    <div class="flex items-start gap-4 mb-4">
      <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0"
        [class.bg-error-container]="isDestructive()"
        [class.text-error]="isDestructive()"
        [class.bg-secondary-container]="!isDestructive()"
        [class.text-secondary]="!isDestructive()">
        <span class="material-symbols-outlined text-[22px]">
          {{ isDestructive() ? 'delete_forever' : 'help_outline' }}
        </span>
      </div>

      <div class="space-y-1 flex-1">
        <h3 class="font-serif text-xl text-on-surface font-semibold">
          {{ title() }}
        </h3>
        <p class="text-sm text-secondary leading-relaxed">
          {{ message() }}
        </p>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex items-center justify-end gap-3 mt-6 pt-4 border-t border-outline-variant/40">
      <button type="button"
        (click)="onCancel()"
        [disabled]="isLoading()"
        class="px-4 py-2 rounded-xl text-xs sm:text-sm font-medium text-secondary hover:text-on-surface hover:bg-surface-container transition-colors disabled:opacity-50 cursor-pointer">
        {{ cancelText() }}
      </button>

      <button type="button"
        (click)="onConfirm()"
        [disabled]="isLoading()"
        class="px-5 py-2 rounded-xl text-xs sm:text-sm font-medium transition-colors disabled:opacity-50 flex items-center gap-2 cursor-pointer shadow-xs"
        [class.bg-error]="isDestructive()"
        [class.text-on-error]="isDestructive()"
        [class.hover:bg-error/90]="isDestructive()"
        [class.bg-primary]="!isDestructive()"
        [class.text-on-primary]="!isDestructive()"
        [class.hover:bg-primary-container]="!isDestructive()">
        @if (isLoading()) {
        <span class="material-symbols-outlined animate-spin text-[16px]">progress_activity</span>
        <span>Processing…</span>
        } @else {
        <span>{{ confirmText() }}</span>
        }
      </button>
    </div>
  </div>
</div>
}
