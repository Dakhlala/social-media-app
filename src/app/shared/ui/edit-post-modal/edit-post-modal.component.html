@if (isOpen() && post()) {
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-xs transition-opacity animate-in fade-in duration-200"
  (click)="onBackdropClick($event)"
  role="dialog"
  aria-modal="true"
  aria-labelledby="edit-dispatch-modal-title">

  <div class="relative w-full max-w-xl bg-surface-container-lowest rounded-2xl border border-outline-variant/60 shadow-2xl flex flex-col max-h-[90vh] overflow-hidden z-10 animate-in zoom-in-95 duration-200"
    (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-4 border-b border-outline-variant/40 bg-surface-container-low/30">
      <div class="flex items-center gap-2.5">
        <span class="material-symbols-outlined text-primary text-[22px]">edit_note</span>
        <h3 id="edit-dispatch-modal-title" class="font-headline-sm text-headline-sm text-on-surface font-semibold">
          Edit Dispatch
        </h3>
      </div>
      <button type="button"
        (click)="onCancel()"
        [disabled]="isSaving()"
        class="text-secondary hover:text-on-surface p-1.5 rounded-lg hover:bg-surface-container transition-colors disabled:opacity-50 cursor-pointer"
        aria-label="Close modal">
        <span class="material-symbols-outlined text-[20px]">close</span>
      </button>
    </div>

    <!-- Body / Form Content -->
    <div class="p-6 overflow-y-auto space-y-4 flex-1">
      <!-- Author info snippet -->
      <div class="flex items-center gap-3">
        <img [alt]="post()?.user?.name || 'Author'"
          class="w-9 h-9 rounded-full object-cover border border-outline-variant"
          [src]="post()?.user?.photo || 'https://pub-3cba56bacf9f4965bbb0989e07dada12.r2.dev/linkedPosts/default-profile.png'">
        <div class="flex flex-col min-w-0">
          <span class="text-label-md font-label-md text-on-surface font-semibold truncate">
            {{ post()?.user?.name || 'Author' }}
          </span>
          <span class="text-body-sm font-body-sm text-secondary truncate">
            &#64;{{ post()?.user?.username || 'scholar' }}
          </span>
        </div>
      </div>

      <!-- Textarea -->
      <div class="relative">
        <textarea
          [ngModel]="editBody()"
          (ngModelChange)="editBody.set($event)"
          rows="5"
          maxlength="800"
          placeholder="Refine your thoughts, scholarly observations, or commentary…"
          class="w-full bg-transparent text-body-lg font-body-lg text-on-surface placeholder:text-secondary/60 focus:outline-none resize-none border border-outline-variant/50 rounded-xl p-3.5 focus:border-primary transition-colors">
        </textarea>
      </div>

      <!-- Attached Plate / Imagery Section -->
      <div class="space-y-2">
        <div class="flex items-center justify-between text-label-sm font-label-sm text-secondary">
          <span>Attached Media</span>
          <button type="button"
            (click)="fileInput.click()"
            class="text-primary hover:underline text-xs flex items-center gap-1 cursor-pointer">
            <span class="material-symbols-outlined text-[16px]">add_photo_alternate</span>
            <span>{{ previewUrl() || existingImageUrl() ? 'Change plate' : 'Attach plate' }}</span>
          </button>
        </div>

        <!-- Hidden input for file picker -->
        <input #fileInput type="file" accept="image/*" class="hidden" (change)="onFileSelected($event)">

        <!-- Preview of newly chosen file -->
        @if (previewUrl()) {
        <div class="relative rounded-xl overflow-hidden border border-outline-variant bg-surface-container max-h-56 group">
          <img [src]="previewUrl()" alt="New plate preview" class="w-full h-48 object-cover">
          <div class="absolute top-2 right-2 flex items-center gap-1.5">
            <span class="bg-primary text-on-primary text-[11px] font-label-sm px-2 py-0.5 rounded-full shadow-xs">
              New Selection
            </span>
            <button type="button"
              (click)="onRemoveNewFile()"
              class="bg-inverse-surface/80 hover:bg-inverse-surface text-inverse-on-surface p-1 rounded-full transition-colors cursor-pointer"
              title="Remove new image">
              <span class="material-symbols-outlined text-[14px]">close</span>
            </button>
          </div>
        </div>
        } @else if (existingImageUrl()) {
        <!-- Display of currently attached image -->
        <div class="relative rounded-xl overflow-hidden border border-outline-variant bg-surface-container max-h-56 group">
          <img [src]="existingImageUrl()" alt="Existing dispatch plate" class="w-full h-48 object-cover">
          <div class="absolute top-2 right-2 flex items-center gap-1.5">
            <span class="bg-surface-container-highest/90 text-on-surface text-[11px] font-label-sm px-2 py-0.5 rounded-full backdrop-blur-xs border border-outline-variant/60 shadow-xs">
              Current Plate
            </span>
            <button type="button"
              (click)="onRemoveExistingImage()"
              class="bg-inverse-surface/80 hover:bg-inverse-surface text-inverse-on-surface p-1 rounded-full transition-colors cursor-pointer"
              title="Remove existing plate">
              <span class="material-symbols-outlined text-[14px]">close</span>
            </button>
          </div>
        </div>
        }
      </div>
    </div>

    <!-- Footer Actions -->
    <div class="flex items-center justify-between px-6 py-4 border-t border-outline-variant/40 bg-surface-container-low/30">
      <span class="text-label-sm font-label-sm text-secondary">
        {{ editBody().length }} / 800
      </span>

      <div class="flex items-center gap-3">
        <button type="button"
          (click)="onCancel()"
          [disabled]="isSaving()"
          class="px-4 py-2 rounded-xl text-label-md font-label-md text-secondary hover:text-on-surface hover:bg-surface-container transition-colors disabled:opacity-50 cursor-pointer">
          Cancel
        </button>

        <button type="button"
          (click)="onSave()"
          [disabled]="isSaving() || (!editBody().trim() && !previewUrl() && !existingImageUrl())"
          class="px-5 py-2 rounded-xl bg-primary text-on-primary font-label-md text-label-md font-medium hover:bg-primary-container transition-colors disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-2 cursor-pointer shadow-xs">
          @if (isSaving()) {
          <span class="material-symbols-outlined animate-spin text-[16px]">progress_activity</span>
          <span>Saving…</span>
          } @else {
          <span class="material-symbols-outlined text-[18px]">save</span>
          <span>Save Changes</span>
          }
        </button>
      </div>
    </div>

  </div>
</div>
}
